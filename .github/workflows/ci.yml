name: Isolated mouse console validation
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - ref: fix/mouse-bridge-console-scope
            artifact: master
          - ref: backport/mouse-bridge-console-scope
            artifact: backport-3.4.0
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Check Windows build
        run: cargo check --bin psmux
      - name: Run console membership unit tests (no servers)
        run: cargo test --bin psmux tests_mouse_bridge_console_scope -- --test-threads=1
      - name: Build patched binary
        run: cargo build --release --bin psmux
      - name: Run isolated real-console regression
        shell: pwsh
        run: |
          $exe = (Resolve-Path target/release/psmux.exe).Path
          & ./tests/test_mouse_bridge_console_scope.ps1 -PsmuxExe $exe
      - name: Record binary provenance
        shell: pwsh
        run: |
          git rev-parse HEAD | Set-Content target/release/source-commit.txt
          (Get-FileHash target/release/psmux.exe -Algorithm SHA256).Hash | Set-Content target/release/psmux.exe.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: psmux-mouse-console-${{ matrix.artifact }}
          path: |
            target/release/psmux.exe
            target/release/source-commit.txt
            target/release/psmux.exe.sha256
          retention-days: 14
